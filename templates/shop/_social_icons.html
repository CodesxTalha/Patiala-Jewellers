{% if store.socials %}
<div class="social-row" aria-label="Social media">
  {% for label, url in store.socials %}
  <a class="social-btn" href="{{ url }}" target="_blank" rel="noopener" aria-label="{{ label }}" title="{{ label }}">
    {% if label == "Instagram" %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></svg>
    {% elif label == "Facebook" %}<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.600-1.500h1.500V4.400A20 20 0 0 0 14.400 4.300c-2.200 0-3.800 1.400-3.800 3.900v2.300H8v3h2.600V21h2.900Z"/></svg>
    {% elif label == "TikTok" %}<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.600 3h-3v11.300a2.400 2.400 0 1 1-2.400-2.400c.2 0 .4 0 .6.100V8.900a5.400 5.400 0 1 0 4.800 5.400V9.500a6.300 6.300 0 0 0 3.600 1.100V7.600a3.700 3.700 0 0 1-3.600-3.300V3Z"/></svg>
    {% elif label == "YouTube" %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.800" y="5.500" width="18.400" height="13" rx="4"/><path d="m10 9.300 5 2.700-5 2.700Z" fill="currentColor"/></svg>
    {% elif label == "Pinterest" %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.500"/><path d="m10.200 19.600 1.800-7.400M9.300 12c-.4-2.700 1.900-4.300 4.100-3.500 2 .7 2.100 3.700.5 5.100-1.300 1.100-3 .6-3-.8"/></svg>
    {% else %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.500 4.500h3.800l11.200 15h-3.800ZM4.800 19.500l6.200-6.800M19.200 4.500l-6.200 6.800"/></svg>{% endif %}
  </a>
  {% endfor %}
</div>
{% endif %}
